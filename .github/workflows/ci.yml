name: Drishti-AI CI Pipeline

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests/unit -p "test_*.py"

    - name: Run Integration Tests
      run: |
        python -m unittest discover -s tests/integration -p "test_*.py"

    - name: Run Comprehensive Verification Suite
      run: |
        python verify_complete_system.py

    - name: Schemas import clean under deprecation-as-error
      run: |
        python -W error::DeprecationWarning -c "import api.schemas, api.main"

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java (for Android toolchain probe)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install dependencies
      run: flutter pub get

    - name: Static analysis
      run: flutter analyze

    - name: Widget + unit tests
      run: flutter test

    - name: Build web (release)
      # DRISHTI_BASE_URL bakes the backend origin into the web bundle.
      # Set repo Settings -> Secrets and variables -> Actions -> Variables ->
      # DRISHTI_BASE_URL (e.g. https://your-backend.onrender.com) for the live
      # demo; unset keeps localhost:8000 for local judging with a local server.
      run: |
        BASE_URL="${{ vars.DRISHTI_BASE_URL }}"
        if [ -z "$BASE_URL" ]; then BASE_URL="http://localhost:8000"; fi
        flutter build web --release --base-href /Drishti-AI/ --no-wasm-dry-run --dart-define=DRISHTI_BASE_URL=$BASE_URL

    - name: Upload web bundle (downloadable preview per run)
      uses: actions/upload-artifact@v4
      with:
        name: flutter-web-${{ github.sha }}
        path: flutter_app/build/web
        retention-days: 7

  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable
        key: 'macos-build'

    - name: Install dependencies
      run: flutter pub get

    - name: Build macOS (release)
      run: |
        BASE_URL="${{ vars.DRISHTI_BASE_URL }}"
        if [ -z "$BASE_URL" ]; then BASE_URL="http://localhost:8000"; fi
        flutter build macos --release --dart-define=DRISHTI_BASE_URL=$BASE_URL

    - name: Package macOS .app
      run: |
        APP_PATH=$(find build/macos/Build/Products/Release -maxdepth 1 -name "*.app" -type d | head -1)
        APP_NAME=$(basename "$APP_PATH")
        echo "Found app: $APP_NAME"
        mkdir -p ./artifacts
        cp -R "$APP_PATH" ./artifacts/
        # Also create a zip for convenience
        cd build/macos/Build/Products/Release
        zip -r "../../../../${APP_NAME%.*}.zip" "$APP_NAME"

    - name: Upload macOS app
      uses: actions/upload-artifact@v4
      with:
        name: drishti-macos-${{ github.sha }}
        path: |
          flutter_app/artifacts/*.app
          flutter_app/*.zip
        retention-days: 30

  deploy-pages:
    # Live preview: every master/main push that passes the flutter job
    # is published to https://bezaleelpaul.github.io/Drishti-AI/
    # (repo Settings -> Pages -> Source must be "GitHub Actions").
    needs: [flutter, macos]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Download web bundle
      uses: actions/download-artifact@v4
      with:
        name: flutter-web-${{ github.sha }}
        path: ./site

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # Cloud-Mac builds (macOS runners are 10x billed minutes: run these ONLY on
  # tags (v*) or manual dispatch — never on every push).
  # macOS .app is unsigned: judges right-click -> Open to bypass Gatekeeper.
  # iOS is --no-codesign (unsigned): validates compilation only. Installing on
  # a real iPhone requires an Apple Developer account ($99/yr), which no free
  # tier can bypass.
  # Required repo secret: DRISHTI_API_KEY (operator key). Optional repo
  # variable: DRISHTI_BASE_URL (defaults to the Render backend below).
  # ---------------------------------------------------------------------------
  build-macos:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
        shell: bash
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install dependencies
      run: flutter pub get

    - name: Build macOS (release)
      run: |
        BASE_URL="${{ vars.DRISHTI_BASE_URL }}"
        if [ -z "$BASE_URL" ]; then BASE_URL="https://drishti-ai-xg6w.onrender.com"; fi
        flutter build macos --release \
          --dart-define=DRISHTI_BASE_URL=$BASE_URL \
          --dart-define=DRISHTI_API_KEY=${{ secrets.DRISHTI_API_KEY }}

    - name: Zip .app bundle
      run: |
        ditto -c -k --sequesterRsrc --keepParent \
          build/macos/Build/Products/Release/netra_ai_mobile.app \
          netra_ai_macos.zip

    - name: Upload macOS bundle
      uses: actions/upload-artifact@v4
      with:
        name: netra-ai-macos-${{ github.sha }}
        path: flutter_app/netra_ai_macos.zip
        retention-days: 14

  build-ios:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults:
      run:
        working-directory: flutter_app
        shell: bash
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install dependencies
      run: flutter pub get

    - name: Build iOS (release, unsigned)
      run: |
        BASE_URL="${{ vars.DRISHTI_BASE_URL }}"
        if [ -z "$BASE_URL" ]; then BASE_URL="https://drishti-ai-xg6w.onrender.com"; fi
        flutter build ios --release --no-codesign \
          --dart-define=DRISHTI_BASE_URL=$BASE_URL \
          --dart-define=DRISHTI_API_KEY=${{ secrets.DRISHTI_API_KEY }}

    - name: Zip unsigned Runner.app
      run: |
        cd build/ios/iphoneos
        zip -r ../../../netra_ai_ios_unsigned.zip Runner.app

    - name: Upload iOS bundle
      uses: actions/upload-artifact@v4
      with:
        name: netra-ai-ios-unsigned-${{ github.sha }}
        path: flutter_app/netra_ai_ios_unsigned.zip
        retention-days: 14
