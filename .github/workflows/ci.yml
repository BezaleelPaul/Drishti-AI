name: Drishti-AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests/unit -p "test_*.py"

    - name: Run Integration Tests
      run: |
        python -m unittest discover -s tests/integration -p "test_*.py"

    - name: Run Comprehensive Verification Suite
      run: |
        python verify_complete_system.py

    - name: Schemas import clean under deprecation-as-error
      run: |
        python -W error::DeprecationWarning -c "import api.schemas, api.main"

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java (for Android toolchain probe)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install dependencies
      run: flutter pub get

    - name: Static analysis
      run: flutter analyze

    - name: Widget + unit tests
      run: flutter test
