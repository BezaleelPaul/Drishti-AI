name: Drishti-AI CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s tests/unit -p "test_*.py"

    - name: Run Integration Tests
      run: |
        python -m unittest discover -s tests/integration -p "test_*.py"

    - name: Run Comprehensive Verification Suite
      run: |
        python verify_complete_system.py

    - name: Schemas import clean under deprecation-as-error
      run: |
        python -W error::DeprecationWarning -c "import api.schemas, api.main"

  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Java (for Android toolchain probe)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: stable

    - name: Install dependencies
      run: flutter pub get

    - name: Static analysis
      run: flutter analyze

    - name: Widget + unit tests
      run: flutter test

    - name: Build web (release)
      # DRISHTI_BASE_URL bakes the backend origin into the web bundle.
      # Set repo Settings -> Secrets and variables -> Actions -> Variables ->
      # DRISHTI_BASE_URL (e.g. https://your-backend.onrender.com) for the live
      # demo; unset keeps localhost:8000 for local judging with a local server.
      run: |
        BASE_URL="${{ vars.DRISHTI_BASE_URL }}"
        if [ -z "$BASE_URL" ]; then BASE_URL="http://localhost:8000"; fi
        flutter build web --release --base-href /Drishti-AI/ --no-wasm-dry-run --dart-define=DRISHTI_BASE_URL=$BASE_URL

    - name: Upload web bundle (downloadable preview per run)
      uses: actions/upload-artifact@v4
      with:
        name: flutter-web-${{ github.sha }}
        path: flutter_app/build/web
        retention-days: 7

  deploy-pages:
    # Live preview: every master/main push that passes the flutter job
    # is published to https://bezaleelpaul.github.io/Drishti-AI/
    # (repo Settings -> Pages -> Source must be "GitHub Actions").
    needs: flutter
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
    - name: Download web bundle
      uses: actions/download-artifact@v4
      with:
        name: flutter-web-${{ github.sha }}
        path: ./site

    - name: Configure Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./site

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
