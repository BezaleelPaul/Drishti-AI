name: netra_ai_mobile
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.2.0+2

environment:
  sdk: ^3.11.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  file_picker: ^12.2.0
  google_fonts: ^6.3.1
  shared_preferences: ^2.3.3

  # On-device offline inference (Ticket A-2). flutter_litert is the
  # maintained, import-compatible successor of the archived tflite_flutter.
  flutter_litert: ^3.8.0
  # Image decode/resize in canonical RGB for the on-device pipeline (A-3).
  image: ^4.2.0
  # Encrypted local store (Ticket B-1): PHI never leaves the device.
  sqflite_sqlcipher: ^3.1.0
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_secure_storage: ^11.2.0
  crypto: ^3.0.7
  camera: ^0.12.0+2
  url_launcher: ^6.3.2
  flame: ^1.38.2

  # --- UI motion & interaction (Ticket C-1) ---
  # flutter_animate: declarative effect chains (fade/slide/scale) for the
  # neon nav rail, dashboard cards and splash logo choreography.
  flutter_animate: ^4.5.2
  # shimmer: sweeping highlight on active nav item + loading skeletons while
  # the dashboard probes the server for live screenings.
  # Pinned to 3.0.0: 4.0.0 requires Dart ^3.12.0 and this project is on 3.11.5.
  shimmer: ^3.0.0
  # flutter_spinkit: HUD-styled loading spinners (queue refresh, model init).
  flutter_spinkit: ^5.2.2
  # animations: Material Motion fade-through page transitions between screens
  # (keeps nav jumps feeling continuous instead of a hard cut).
  # Pinned to 2.2.0: 3.0.0 requires Dart ^3.12.0 and this project is on 3.11.5.
  animations: ^2.2.0
  # fl_chart: DR-severity distribution bar chart on the dashboard — derived
  # from real result counts, never synthetic decoration.
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Brand icon generator: replaces the stock Flutter launcher icon with the
  # Drishti-AI retinal-eye mark across every density (+ Android adaptive
  # icon). Sources live in assets/branding (generated by
  # tool/generate_brand_icon.py); run via `dart run flutter_launcher_icons`.
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "assets/branding/drishti_icon.png"
  android: "ic_launcher"
  adaptive_icon_background: "#020617"
  adaptive_icon_foreground: "assets/branding/drishti_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  ios: true

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # Explicit asset allowlist (privacy): NEVER bundle real patient scans.
  # A directory glob would silently ship any PHI dropped into the folder.
  # Add new demo/synthetic samples here one file at a time.
  assets:
    - assets/images/1_blurry_eye_retake.jpg
    - assets/images/2_clear_eye_normal.jpg
    - assets/images/3_severe_eye_referral.jpg
    - assets/images/scenario_1_good.jpg
    - assets/images/scenario_2_bad.jpg
    - assets/images/scenario_3_borderline.jpg
    - assets/images/scenario_4_uncertain.jpg
    - assets/images/real_clinical_drimdb_sample.jpg
    # On-device DR model (Ticket A-1: SHIPPED — fp32, parity-gated with
    # 100% top-1 agreement on the clinical corpus; fp16 drifted 0.29 and
    # was rejected by validate_tflite_quantized.py. int8 upgrade pending a
    # real calibration corpus.)
    - assets/models/dr_efficientnet_b0_fp32.tflite
    # DRDetect ordinal regression (primary grader). Converted from
    # efficientnet_b0_regression_512px.onnx via onnx2tf; TFLite vs ONNX
    # parity PASSED (10/10 grade agreement, max |score diff| 3e-5 —
    # results/drdetect_tflite_parity.json). SHA-256:
    # 8644E287098D347F2D91A6327ACD5ED90A263E6535A8308EEA4B5BF3B82CE3C0
    - assets/models/drdetect_ordinal_512_fp32.tflite

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
