version: "3.8"

services:
  drishti-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drishti_screening_platform
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ENABLE_CORS=false
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    volumes:
      - ./results:/app/results
    restart: unless-stopped
