version: "3.8"

services:
  # FastAPI REST Backend Bridge and Flutter Web Application.
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: drishti_api_backend
    command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=prod
      - DRISHTI_API_KEYS=${DRISHTI_API_KEYS:?Set DRISHTI_API_KEYS to key:role before starting the backend}
    volumes:
      - ./data:/app/data
      - ./results:/app/results
    restart: unless-stopped
